:root{--navy:#0b1428;--navy2:#14223d;--gold:#d8b66a;--gold2:#f0d99a;--muted:#aeb9cb;--line:rgba(216,182,106,.28)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#07101f;color:#fff}body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.portal-head{flex:none;background:linear-gradient(115deg,#0b1428,#14223d);padding:16px max(12px,calc((100% - 1500px)/2));border-bottom:2px solid var(--gold);position:relative;z-index:100;box-shadow:0 8px 24px #07101f30}.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:42px;height:42px;flex:none;border-radius:13px;background:linear-gradient(145deg,var(--gold2),#9d7b35);display:grid;place-items:center;color:#07101f;font-weight:900;font-size:19px}.brand-title{font-size:17px;font-weight:850;letter-spacing:.5px}.brand-sub{font-size:10px;color:#bac5d8;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#c4cede;padding:11px 16px;border-radius:11px;font:700 13px/1.2 inherit;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:43px}.tab:hover{background:rgba(255,255,255,.09);color:white}.icon-svg{width:23px;height:23px;display:inline-block;flex:none;color:#d8b66a;vertical-align:middle}.tab .icon-svg{width:24px;height:24px}.tab{color:#d8b66a;font-size:14px}.tab span{color:inherit}.tab.active{background:linear-gradient(90deg,rgba(216,182,106,.22),rgba(216,182,106,.08));border-color:var(--gold);color:var(--gold2);box-shadow:inset 0 -2px var(--gold)}main{flex:1;min-height:0;display:flex;overflow:hidden}.app-frame{display:block;flex:1 1 auto;width:100%;height:100%;min-height:0;border:0;background:#f5f6f9;overflow:auto}.app-frame[hidden]{display:none!important}.portal-footer{color:#8794aa;font-size:11px;text-align:center;padding:12px 15px 20px}.help{max-width:1100px;margin:10px auto;padding:0 14px;color:#aeb9cb;font-size:11px;line-height:1.5}@media(max-width:600px){.portal-head{padding:12px 10px}.brand{margin-bottom:11px}.brand-title{font-size:15px}.brand-sub{font-size:9px;letter-spacing:1px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tab{justify-content:center;padding:10px 4px;font-size:11px;gap:4px;min-width:0}.tab .icon-svg{width:19px;height:19px}}@media print{html,body{height:auto;overflow:visible;display:block}.portal-head,.portal-footer,.help{display:none!important}.app-frame[hidden]{display:none!important}.app-frame{display:block;width:100%;height:100vh;min-height:100vh}}

#auth-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#1a2b48 0%,#07101f 70%);color:#fff}#auth-gate[hidden]{display:none!important}.auth-card{width:min(100%,420px);padding:30px 26px;border:1px solid rgba(216,182,106,.55);border-radius:22px;background:linear-gradient(150deg,#14223d,#0b1428);box-shadow:0 24px 80px rgba(0,0,0,.4)}.auth-logo{width:58px;height:58px;margin:0 auto 15px;border:2px solid #d8b66a;border-radius:17px;display:grid;place-items:center;color:#f0d99a;font-weight:900;font-size:22px}.auth-card h1{text-align:center;font-size:22px;margin:0 0 7px}.auth-sub{text-align:center;color:#aeb9cb;font-size:13px;line-height:1.5;margin:0 0 24px}.auth-field{display:block;margin:14px 0 0;color:#d8dfeb;font-size:12px;font-weight:700}.auth-field input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.17);background:#081326;color:white;font-size:15px}.auth-remember{display:flex;align-items:center;gap:9px;color:#c4cede;font-size:12px;margin:16px 0}.auth-remember input{width:16px;height:16px;accent-color:#d8b66a}.auth-submit{width:100%;padding:13px;border:1px solid #f0d99a;border-radius:11px;background:linear-gradient(110deg,#b89a61,#e2c77f);color:#111a2b;font-weight:850;font-size:14px}.auth-message{min-height:20px;margin:13px 0 0;color:#f0d99a;font-size:12px;line-height:1.5;text-align:center}#portal-userbar{position:fixed;right:12px;top:10px;z-index:1000;display:flex;gap:8px;align-items:center;color:#c4cede;font-size:11px}#portal-userbar[hidden]{display:none!important}#portal-userbar button{border:1px solid rgba(216,182,106,.55);border-radius:8px;padding:6px 9px;background:#14223d;color:#f0d99a;font-size:11px}@media(max-width:600px){.auth-card{padding:25px 20px}.auth-card h1{font-size:20px}}

/* Match the logout button hover feedback to the Hotel Desk / SPA Desk tabs */
#portal-userbar button{transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease;cursor:pointer}
#portal-userbar button:hover{background:linear-gradient(90deg,rgba(216,182,106,.22),rgba(216,182,106,.08));border-color:#d8b66a;color:#f0d99a;box-shadow:inset 0 -2px #d8b66a}
#portal-userbar button:focus-visible{outline:2px solid #d8b66a;outline-offset:2px}

/* Unified typography: use the exact font stack already used by Hotel Desk */
html,body,body *{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important}
button,input,select,textarea{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important}

/* ===== Refresh: единый набор иконок и обновлённое оформление ===== */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic-inline{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin:0 3px}
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.btn .ic{width:17px;height:17px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--navy:#0b1428;--navy2:#14223d;--gold:#d8b66a;--gold2:#f0d99a}
.portal-head{padding-top:14px;padding-bottom:0;border-bottom:1px solid rgba(216,182,106,.38);background:radial-gradient(80% 160% at 0 0,#1b2f57 0,transparent 55%),linear-gradient(115deg,#0b1428,#14223d)}
.brand{margin-bottom:12px}
.logo{border-radius:13px;box-shadow:0 8px 20px rgba(216,182,106,.22),inset 0 1px 0 rgba(255,255,255,.45)}
.brand-title{font-weight:800;letter-spacing:.8px}
.tabs{gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;border-radius:12px 12px 0 0;color:#aab6ca;padding:11px 16px 12px;min-height:44px;font-size:14px;font-weight:650;position:relative;white-space:nowrap;transition:.16s}
.tab .icon-svg{width:20px;height:20px;color:#8393ad;stroke-width:1.75;transition:.16s}
.tab:hover{background:rgba(255,255,255,.06);color:#fff}
.tab:hover .icon-svg{color:#e8d6a6}
.tab.active{background:linear-gradient(180deg,rgba(216,182,106,.2),rgba(216,182,106,.05));color:var(--gold2);box-shadow:none}
.tab.active .icon-svg{color:var(--gold)}
.tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--gold)}
#portal-userbar{align-items:center}
#portal-userbar button{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 11px;font-weight:650}
#portal-userbar button .ic{width:15px;height:15px}
.auth-card{border-radius:26px;padding:34px 28px;background:radial-gradient(100% 70% at 50% 0,#1d3358 0,transparent 70%),linear-gradient(150deg,#14223d,#0b1428);box-shadow:0 30px 90px rgba(0,0,0,.45)}
.auth-logo{border-radius:18px;background:linear-gradient(145deg,rgba(240,217,154,.18),rgba(216,182,106,.04))}
.auth-field input{border-radius:12px;padding:13px 14px}
.auth-field input:focus{outline:0;border-color:#d8b66a;box-shadow:0 0 0 4px rgba(216,182,106,.2)}
.auth-submit{border-radius:12px;padding:14px;background:linear-gradient(180deg,#ecd391,#d3b061);box-shadow:0 8px 20px rgba(216,182,106,.3)}
.auth-loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#f0d99a;padding:14px 0;font-size:13px}
.auth-loading .ic{width:18px;height:18px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
 .portal-head{padding-bottom:0}
 .tabs{display:flex;gap:2px}
 .tab{flex:1;justify-content:center;padding:10px 4px 11px;font-size:12px;gap:6px}
 .tab .icon-svg{width:18px;height:18px}
 .tab.active:after{left:8px;right:8px}

function msg(s){$('auth-message').textContent=s||'';}
function showLoginForm(){ $('auth-loading').hidden=true; $('auth-fields').hidden=false; $('auth-sub').textContent='Защищённый вход в рабочий портал. Введите общий аккаунт сотрудников.'; }
function activate(key){Object.keys(frames).forEach(k=>{const active=k===key;frames[k].hidden=!active;const b=document.querySelector('[data-app="'+k+'"]');if(b){b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));}});document.title=names[key]+' — Hotel Desk';try{history.replaceState(null,'','#'+key)}catch(e){}}
function startApps(){if(started)return;started=true;Object.keys(frames).forEach(k=>frames[k].srcdoc=documents[k]);const key=location.hash.slice(1);activate(frames[key]?key:'hotel');}
async function cloudRead(key){const {data,error}=await client.from('app_data').select('data').eq('app_key',key).maybeSingle();if(error)throw error;return data?data.data:null;}
async function cloudWrite(key,payload){let data;try{data=JSON.parse(payload)}catch(e){return}const {error}=await client.from('app_data').upsert({app_key:key,data,updated_at:new Date().toISOString()},{onConflict:'app_key'});if(error)throw error;}
async function loadCloud(){msg('Проверяем облачные данные…');for(const x of [{app:'hotel',storage:'hotelDeskFresh_v1',fallback:{tasks:[],reports:[],checklist:{},draft:{},lastPreview:''}},{app:'spa',storage:'spaDeskBookings_v1',fallback:{bookings:[]}}]){const remote=await cloudRead(x.app);let local=null;try{local=localStorage.getItem(x.storage)}catch(e){}if(remote!==null&&remote!==undefined){localStorage.setItem(x.storage,JSON.stringify(remote));}else if(local){await cloudWrite(x.app,local);}else{await cloudWrite(x.app,JSON.stringify(x.fallback));localStorage.setItem(x.storage,JSON.stringify(x.fallback));}}startApps();$('portal-user-email').textContent=user.email||'Вход выполнен';showGate(false);msg('');}
Object.keys(frames).forEach(k=>document.querySelector('[data-app="'+k+'"]').addEventListener('click',()=>activate(k)));
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='hoteldesk-cloud-save'||!user||!client||!['hotel','spa'].includes(d.appKey)||typeof d.payload!=='string')return;queue=queue.then(()=>cloudWrite(d.appKey,d.payload)).catch(err=>{console.error(err);msg('Ошибка облачного сохранения: '+(err.message||''));});});
$('auth-form').addEventListener('submit',async e=>{e.preventDefault();if(!client){msg('Модуль входа ещё загружается. Подождите несколько секунд и попробуйте снова.');return;}const b=$('auth-submit');b.disabled=true;b.textContent='Входим…';msg('');try{const {data,error}=await client.auth.signInWithPassword({email:$('auth-email').value.trim(),password:$('auth-password').value});if(error)throw error;user=data.user;await loadCloud();}catch(err){console.error(err);showLoginForm();msg(err.message==='Invalid login credentials'?'Неверная почта или пароль.':'Не удалось подключиться: '+(err.message||'проверьте настройки Supabase'));}finally{b.disabled=false;b.textContent='Войти в портал';}});
$('auth-logout').addEventListener('click',async()=>{const b=$('auth-logout');b.disabled=true;try{if(client) { const {error}=await client.auth.signOut(); if(error) throw error; } user=null;started=false;Object.keys(frames).forEach(k=>frames[k].srcdoc='');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}showGate(true);showLoginForm();msg('Вы вышли из портала. Введите почту и пароль для повторного входа.');$('auth-password').value='';document.title='Вход — Hotel Desk';}catch(err){console.error(err);msg('Не удалось выйти из портала: '+(err.message||'попробуйте ещё раз.'));}finally{b.disabled=false;}});
let spaBookings=[], reminderTimer=null, audioCtx=null, remindersEnabled=(localStorage.getItem('hotelDeskSpaRemindersEnabled_v1')!=='false');
const sentKey='hotelDeskSpaRemindersSent_v1';
function sentReminders(){try{return JSON.parse(localStorage.getItem(sentKey)||'{}')}catch(e){return {}}}
function saveSent(v){try{localStorage.setItem(sentKey,JSON.stringify(v))}catch(e){}}
function beep(){try{if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.8);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.85)}catch(e){}}
function playSpaReminderSound(){try{const f=document.getElementById('frame-spa');if(f&&f.contentWindow){f.contentWindow.postMessage({type:'spa-play-reminder-sound'},'*');return}}catch(e){}beep()}
function syncReminderState(){const f=document.getElementById('frame-spa');if(f&&f.contentWindow)f.contentWindow.postMessage({type:'spa-reminders-state',enabled:remindersEnabled},'*')}
function updateReminderButton(){try{localStorage.setItem('hotelDeskSpaRemindersEnabled_v1',String(remindersEnabled))}catch(e){}syncReminderState()}
async function unlockReminderAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state!=='running')await audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',()=>{unlockReminderAudio()},{capture:true,passive:true});document.addEventListener('keydown',()=>{unlockReminderAudio()},{capture:true});
async function enableReminders(){try{if(!('Notification'in window)){alert('Этот браузер не поддерживает системные уведомления. Попробуйте Chrome или Edge.');remindersEnabled=false;updateReminderButton();return false}if(Notification.permission==='default'){const p=await Notification.requestPermission();if(p!=='granted'){alert('Разрешите уведомления для сайта в настройках браузера.');remindersEnabled=false;updateReminderButton();return false}}if(Notification.permission!=='granted'){alert('Уведомления заблокированы. Разрешите их в настройках сайта браузера.');remindersEnabled=false;updateReminderButton();return false}await unlockReminderAudio();remindersEnabled=true;updateReminderButton();checkReminders();return true}catch(e){alert('Не удалось включить напоминания. Проверьте разрешения браузера.');remindersEnabled=false;updateReminderButton();return false}}
window.addEventListener('message',async e=>{if(!e.data)return;if(e.data.type==='spa-bookings-update'&&Array.isArray(e.data.bookings)){spaBookings=e.data.bookings;syncReminderState();checkReminders()}if(e.data.type==='spa-audio-unlock'){await unlockReminderAudio()}if(e.data.type==='spa-toggle-reminders'){if(remindersEnabled){remindersEnabled=false;updateReminderButton()}else await enableReminders()}});
function checkReminders(){if(!remindersEnabled||!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now(),sent=sentReminders();for(const b of spaBookings){if(!b||!b.date||!b.time||!(b.service==='Сауна + хаммам'||b.service==='sauna'))continue;const start=new Date(b.date+'T'+b.time+':00').getTime();if(!Number.isFinite(start))continue;const key=String(b.id||'')+'|'+b.date+'|'+b.time;if(now>=start-60*60*1000&&now<start&& !sent[key]){try{const n=new Notification('SPA Desk — скоро хаммам',{body:(b.name||'Гость')+' · '+b.time+' · '+(b.zone==='male'?'правый хаммам':'левый хаммам'),tag:'spa-'+key,requireInteraction:true});n.onclick=()=>{window.focus();activate('spa');n.close()};playSpaReminderSound();sent[key]=new Date().toISOString();saveSent(sent)}catch(err){}}}}
updateReminderButton();setInterval(checkReminders,30000);
const sdk=document.createElement('script');sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sdk.onload=async()=>{try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;await loadCloud();}else{showLoginForm();}}catch(err){console.error(err);showLoginForm();msg('Ошибка подключения к Supabase: '+(err.message||'Проверьте интернет и настройки проекта.'));}};sdk.onerror=()=>{showLoginForm();msg('Не удалось загрузить модуль входа. Проверьте интернет и обновите страницу.');};document.head.appendChild(sdk);
})();
</script></body></html>
